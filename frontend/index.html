<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AWS Serverless Order Processing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card shadow-lg p-5">

        <h6 class="aws-title">
            AWS SERVERLESS DEMO
        </h6>

        <h1 class="mb-3">
            Event-Driven Order Processing
        </h1>

        <p class="subtitle">
            Submit an order and watch AWS process it using
            API Gateway, Lambda, DynamoDB, SQS and SES.
        </p>

        <form id="orderForm">

            <div class="mb-3">

                <label class="form-label">
                    Customer Name
                </label>

                <input
                    id="customerName"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Product
                </label>

                <input
                    id="product"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Quantity
                </label>

                <input
                    id="quantity"
                    type="number"
                    value="1"
                    min="1"
                    class="form-control"
                    required>

            </div>

            <button
                id="submitBtn"
                class="btn btn-warning w-100">

                Submit Order

            </button>

        </form>

        <div id="result" class="mt-4"></div>

        <hr>

        <div class="tech-stack">

            <span>API Gateway</span>

            <span>Lambda</span>

            <span>DynamoDB</span>

            <span>SQS</span>

            <span>SES</span>

            <span>S3</span>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
